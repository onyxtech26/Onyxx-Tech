<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onyxx Tech Hub — Set a New Password</title>

  <!-- A password-reset URL must never be indexed or shared onward. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />

  <link rel="icon" type="image/png" href="images/favicon-white.png" />
  <link rel="icon" type="image/png" href="images/favicon-black.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="images/favicon-white.png" media="(prefers-color-scheme: dark)" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --onyx: #0a0a0a;
      --bone: #ffffff;
      --bone-dim: #d8d8d2;
      --accent: #38e0ff;
      --accent-dim: rgba(56, 224, 255, 0.3);
      --neg: #f87171;
      --pos: #4ade80;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Outfit', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
      --glass-bg: rgba(25, 25, 25, 0.25);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-top: rgba(255, 255, 255, 0.15);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --onyx: #f5f5f7;
      --bone: #1d1d1f;
      --bone-dim: #515154;
      --accent: #0066cc;
      --accent-dim: rgba(0, 102, 204, 0.3);
      --neg: #b91c1c;
      --pos: #15803d;
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-border-top: rgba(0, 0, 0, 0.12);
    }

    :root[data-theme="light"] .login-logo { filter: invert(1) brightness(0); }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--onyx);
      color: var(--bone);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .glass-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.7;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(56,224,255,0.4) 0%, rgba(138,43,226,0.1) 70%);
      top: -10%; left: -10%;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .login-logo {
      display: block;
      width: 54px;
      margin: 0 auto 1.25rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 500;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .sub {
      text-align: center;
      color: var(--bone-dim);
      font-size: 0.85rem;
      line-height: 1.55;
      margin-bottom: 1.75rem;
    }

    .form-group { margin-bottom: 1.1rem; }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bone-dim);
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--bone);
      font-family: var(--font-body);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    :root[data-theme="light"] .form-input { background: rgba(0,0,0,0.04); }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--bone-dim);
      margin-top: 0.4rem;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      min-height: 44px;
      background: var(--accent);
      color: #04121a;
      border: none;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    :root[data-theme="light"] .btn { color: #ffffff; }
    .btn:hover:not([disabled]) { transform: translateY(-1px); }
    .btn[disabled] { opacity: 0.55; cursor: default; }
    .btn:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }

    .msg {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.55;
    }
    .msg.show { display: block; }
    .msg.error { border: 1px solid var(--neg); background: rgba(248,113,113,0.08); }
    .msg.ok    { border: 1px solid var(--pos); background: rgba(74,222,128,0.08); }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--bone-dim);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-decoration: none;
      transition: color 0.25s ease;
    }
    .back-link:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="glass-orb orb-1" aria-hidden="true"></div>

  <div class="card">
    <img src="images/onyxx_logo_transparent.png" alt="Onyxx Tech" class="login-logo" />
    <h1>Set a new password</h1>
    <p class="sub" id="subtitle">Checking your reset link…</p>

    <form id="resetForm" hidden>
      <div class="form-group">
        <label class="form-label" for="pw1">New password</label>
        <input class="form-input" type="password" id="pw1" required minlength="10"
               autocomplete="new-password" placeholder="••••••••••" />
        <div class="hint">At least 10 characters. Longer beats complicated.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="pw2">Confirm new password</label>
        <input class="form-input" type="password" id="pw2" required minlength="10"
               autocomplete="new-password" placeholder="••••••••••" />
      </div>
      <button type="submit" class="btn" id="saveBtn">Update password</button>
    </form>

    <div id="msg" class="msg"></div>

    <a href="admin-login.html" class="back-link">← Back to login</a>
  </div>

  <script>
    /* FIRST STATEMENT ON THE PAGE, deliberately — before createClient() below.
       supabase-js `detectSessionInUrl` consumes the fragment and rewrites the
       URL as soon as the client is constructed, so anything that reads
       location.hash after that line sees nothing and cannot tell a genuine
       recovery arrival from someone simply opening this URL. Moving this even
       one line down silently disables both the recovery gate and the error
       message. */
    const ARRIVED_WITH = (function () {
      const raw = (location.hash || '').replace(/^#/, '');
      const p = new URLSearchParams(raw);
      return {
        recovery: p.get('type') === 'recovery' || /(^|&)type=recovery(&|$)/.test(raw),
        error: p.get('error_description') || p.get('error') || ''
      };
    })();

    const supabaseUrl = 'https://whjstsgtximknicppllt.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoanN0c2d0eGlta25pY3BwbGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3OTc5NzgsImV4cCI6MjA5ODM3Mzk3OH0.I_GHJG8XcyFO_WamEwWnme_-l1ZPUCUCuZ7roOE-B2U';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    const form = document.getElementById('resetForm');
    const subtitle = document.getElementById('subtitle');
    const msg = document.getElementById('msg');
    const saveBtn = document.getElementById('saveBtn');
    const pw1 = document.getElementById('pw1');
    const pw2 = document.getElementById('pw2');

    function show(text, kind) {
      msg.textContent = text;
      msg.className = 'msg show ' + kind;
    }

    /* Supabase puts the recovery token in the URL FRAGMENT and, with the
       default detectSessionInUrl, exchanges it for a session automatically.
       That session is the only thing authorising updateUser() below — which is
       why this page must be the ONLY configured redirect target. If a recovery
       link resolves anywhere else in the app, that page silently signs the user
       in with their OLD password still set and never offers to change it.

       Listening for PASSWORD_RECOVERY rather than reading the fragment
       ourselves: the exchange is async, so the session is not there yet on
       first paint. */
    let recoveryReady = false;
    let linkFailed = false;

    function revealForm(email) {
      // A failed link must never end up showing a working form underneath its
      // own error message.
      if (linkFailed) return;
      recoveryReady = true;
      subtitle.textContent = 'Choose a new password for ' + (email || 'your account') + '.';
      form.hidden = false;
      msg.className = 'msg';
      pw1.focus();
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      // PASSWORD_RECOVERY is the only event that proves a recovery token was
      // used. SIGNED_IN is accepted ONLY when this page was opened with a
      // recovery fragment — supabase-js sometimes reports the exchange that
      // way, but on its own it is also what an ordinary sign-in looks like.
      const isRecovery = event === 'PASSWORD_RECOVERY'
        || (event === 'SIGNED_IN' && session && ARRIVED_WITH.recovery);
      if (isRecovery) revealForm(session?.user?.email);
    });

    // An expired or already-used link returns an error in the fragment instead
    // of a token.
    (function readFragmentError() {
      if (!ARRIVED_WITH.error) return;
      linkFailed = true;
      form.hidden = true;
      subtitle.textContent = 'That link did not work.';
      // NOT decodeURIComponent: URLSearchParams has already percent-decoded
      // this and already turned '+' into spaces. Decoding twice threw URIError
      // on any message containing a literal '%' — and because this runs at top
      // level, that throw aborted the rest of the script and the submit handler
      // was never attached, leaving a dead button.
      show(ARRIVED_WITH.error +
           '. Reset links expire after about an hour and can only be used once — request a new one from the login page.',
           'error');
    })();

    /* Fallback for the race where the token exchange completed before the
       listener attached.

       GATED ON ARRIVED_WITH.recovery, and that gate is the whole point. This
       page and the dashboard share an origin, a Supabase project and therefore
       a localStorage session key — so `getSession()` happily returns an
       ordinary dashboard login. Without the gate, anyone opening this URL on an
       already-signed-in browser was shown the form and could set a new password
       with no recovery token and no knowledge of the old one. */
    (async function checkExisting() {
      const { data } = await supabaseClient.auth.getSession();

      if (data.session && ARRIVED_WITH.recovery && !recoveryReady && !linkFailed) {
        revealForm(data.session.user?.email);
        return;
      }
      if (linkFailed || recoveryReady) return;

      subtitle.textContent = 'This page needs a reset link.';
      show(data.session
        ? 'You are signed in, but changing a password here needs a fresh reset link. Request one from the login page.'
        : 'Open the link from your password-reset email, or request one from the login page.', 'error');
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!recoveryReady) return;

      if (pw1.value !== pw2.value) {
        show('The two passwords do not match.', 'error');
        pw2.focus();
        return;
      }
      if (pw1.value.length < 10) {
        show('Use at least 10 characters.', 'error');
        pw1.focus();
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Updating…';
      msg.className = 'msg';

      const { error } = await supabaseClient.auth.updateUser({ password: pw1.value });

      if (error) {
        show('Could not update the password: ' + error.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Update password';
        return;
      }

      form.hidden = true;
      subtitle.textContent = 'Done.';
      show('Password updated. Signing you out of this recovery session — sign in with the new password.', 'ok');

      // The recovery session is a credential in its own right. Do not leave it
      // sitting in localStorage, and do not walk the user straight into the
      // dashboard on it: signing in again proves the new password works.
      //
      // Check the result. If sign-out fails the session survives, and the
      // redirect below lands on admin-login, whose checkSession() sees that
      // session and forwards straight to the dashboard — the exact outcome
      // this sign-out exists to prevent. Say so rather than pretending.
      const { error: outErr } = await supabaseClient.auth.signOut();
      if (outErr) {
        show('Password updated — but this browser could not be signed out of the '
             + 'recovery session. Close this tab, then sign in fresh with the new password.', 'error');
      }

      // Strip the token out of the URL and out of history.
      history.replaceState(null, '', location.pathname);

      setTimeout(() => { window.location.href = 'admin-login.html'; }, 3500);
    });
  </script>
</body>
</html>

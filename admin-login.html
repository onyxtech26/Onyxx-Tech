<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onyxx Tech Hub — Admin Login</title>
  
  <link rel="icon" type="image/png" href="images/favicon-white.png" />
  <link rel="icon" type="image/png" href="images/favicon-black.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="images/favicon-white.png" media="(prefers-color-scheme: dark)" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- dotLottie Player -->
  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
  <script>
    // Flag the document once the custom element upgrades, so the CSS can
    // swap the fallback spinner out for the Lottie (and never show both).
    if (window.customElements) {
      customElements.whenDefined('dotlottie-player')
        .then(function () { document.documentElement.classList.add('lottie-ready'); })
        .catch(function () { /* keep the spinner */ });
    }
  </script>

  <style>
    :root {
      --onyx: #0a0a0a;
      --bone: #ffffff;
      --bone-dim: #d8d8d2;
      --accent: #38e0ff;
      --accent-dim: rgba(56, 224, 255, 0.3);
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Outfit', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;

      --glass-bg: rgba(25, 25, 25, 0.25);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-top: rgba(255, 255, 255, 0.15);
    }

    :root[data-theme="light"] {
      --onyx: #f5f5f7;
      --bone: #1d1d1f;
      --bone-dim: #515154;
      --accent: #0066cc;
      --accent-dim: rgba(0, 102, 204, 0.3);

      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-border-top: rgba(0, 0, 0, 0.12);
    }

    :root[data-theme="light"] .login-logo {
      filter: invert(1) brightness(0);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--onyx);
      color: var(--bone);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Glass Orbs */
    .glass-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      animation: floatOrb 25s ease-in-out infinite alternate;
      opacity: 0.7;
    }
    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56,224,255,0.4) 0%, rgba(138,43,226,0.1) 70%);
      top: -10%;
      left: -10%;
    }
    .orb-2 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(138,43,226,0.3) 0%, rgba(56,224,255,0.1) 70%);
      bottom: -15%;
      right: -5%;
      animation-delay: -10s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(100px, 150px) scale(1.1); }
      100% { transform: translate(-50px, 80px) scale(0.9); }
    }

    .login-container {
      position: relative;
      z-index: 10;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      transition: all 0.3s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      height: 48px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      margin-bottom: 1.5rem;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 400;
      color: var(--bone);
      margin-bottom: 0.5rem;
    }

    .login-sub {
      color: var(--bone-dim);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--bone-dim);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 1rem;
      color: var(--bone);
      font-family: var(--font-body);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 15px rgba(56, 224, 255, 0.15);
    }

    .btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      color: var(--bone);
      border: 1px solid rgba(255,255,255,0.1);
      border-top: 1px solid rgba(255,255,255,0.3);
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      margin-top: 1rem;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
      transform: translateY(-2px);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Inline loading state inside the submit button */
    .btn-loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .btn-loading dotlottie-player { width: 22px; height: 22px; display: block; }
    .spinner-inline {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spinInline 0.9s linear infinite;
    }
    @keyframes spinInline { to { transform: rotate(360deg); } }
    html:not(.lottie-ready) .btn-loading dotlottie-player { display: none; }
    html.lottie-ready .btn-loading .spinner-inline { display: none; }

    .error-message {
      color: #ff4a4a;
      font-size: 0.85rem;
      margin-top: 1rem;
      text-align: center;
      display: none;
    }
    
    .back-link {
      display: block;
      text-align: center;
      margin-top: 2rem;
      color: var(--bone-dim);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.3s;
    }
    .back-link:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="glass-orb orb-1"></div>
  <div class="glass-orb orb-2"></div>

  <div class="login-container" style="position: relative; overflow: hidden;">
    <!-- Theme Switcher Button -->
    <button id="themeToggleBtn" class="theme-toggle-login" onclick="toggleTheme()" aria-label="Toggle Theme">
      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- Success Overlay -->
    <div id="successOverlay" class="success-overlay">
      <div class="success-circle">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 class="success-title">Access Granted</h2>
      <p class="success-subtitle">Directing to Dashboard</p>
    </div>

    <div class="login-header">
      <img src="images/onyxx_logo_&_name_transparent.png" alt="Onyxx Tech Hub" class="login-logo" />
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-sub">Secure access for Onyxx Tech Hub</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" required placeholder="admin@onyxx.tech" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" required placeholder="••••••••" />
      </div>
      
      <div id="errorMsg" class="error-message">Invalid login credentials.</div>
      
      <button type="submit" class="btn" id="loginBtn">Authenticate</button>
    </form>
    
    <a href="index.html" class="back-link">← Return to site</a>
  </div>

  <style>
    @keyframes pulseCyan {
      0% { transform: scale(1); box-shadow: 0 0 20px var(--accent-dim); }
      50% { transform: scale(1.05); box-shadow: 0 0 35px var(--accent-dim); }
      100% { transform: scale(1); box-shadow: 0 0 20px var(--accent-dim); }
    }
    .theme-toggle-login {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: transparent;
      border: none;
      color: var(--bone-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      transition: color 0.3s ease;
      z-index: 15;
    }
    .theme-toggle-login:hover {
      color: var(--accent);
    }
    .theme-toggle-login svg {
      width: 20px;
      height: 20px;
    }
    .success-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border-radius: 20px;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    :root[data-theme="light"] .success-overlay {
      background: rgba(255, 255, 255, 0.95);
    }
    .success-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 20px var(--accent-dim);
      animation: pulseCyan 2s infinite;
    }
    .success-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--bone);
      margin-bottom: 0.5rem;
      font-weight: 400;
    }
    .success-subtitle {
      color: var(--bone-dim);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
  </style>

  <script>
    // Initialize Supabase Client
    const supabaseUrl = 'https://whjstsgtximknicppllt.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoanN0c2d0eGlta25pY3BwbGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3OTc5NzgsImV4cCI6MjA5ODM3Mzk3OH0.I_GHJG8XcyFO_WamEwWnme_-l1ZPUCUCuZ7roOE-B2U';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successOverlay = document.getElementById('successOverlay');

    // Check if already logged in
    async function checkSession() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (data.session) {
        window.location.href = 'admin-dashboard.html';
      }
    }
    checkSession();

    /* Button loading state — the same dotLottie animation the rest of the
       site uses, shrunk to sit inline in the button. `.spinner-inline` is
       the CSS fallback for when the CDN player module never arrives; CSS
       shows exactly one of the two based on <html>.lottie-ready. */
    function setLoginBtnLoading(isLoading) {
      loginBtn.disabled = isLoading;
      loginBtn.innerHTML = isLoading
        ? `<span class="btn-loading">
             <span class="spinner-inline" aria-hidden="true"></span>
             <dotlottie-player src="images/loading.lottie" background="transparent" speed="1" loop autoplay aria-hidden="true"></dotlottie-player>
             Authenticating…
           </span>`
        : 'Authenticate';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Trimmed because Supabase compares the address literally: a trailing
      // space picked up from autofill or a paste comes back as the generic
      // "Invalid login credentials", which reads as a wrong password and sends
      // you looking in the wrong place. The password is deliberately NOT
      // trimmed — spaces there may be intentional.
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      
      setLoginBtnLoading(true);
      errorMsg.style.display = 'none';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
          setLoginBtnLoading(false);
        } else {
          // Show Success Overlay with premium transition
          successOverlay.style.display = 'flex';
          setTimeout(() => {
            successOverlay.style.opacity = '1';
          }, 10);
          
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 1200);
        }
      } catch (err) {
        errorMsg.textContent = err.message || "An unexpected error occurred.";
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Authenticate';
      }
    });

    // ============ THEME SWITCHER LOGIC ============
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const targetTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', targetTheme);
      localStorage.setItem('theme', targetTheme);
      updateThemeToggleIcons();
    }

    function updateThemeToggleIcons() {
      const theme = document.documentElement.getAttribute('data-theme');
      const toggleBtn = document.getElementById('themeToggleBtn');
      if (!toggleBtn) return;
      const sunIcon = toggleBtn.querySelector('.sun-icon');
      const moonIcon = toggleBtn.querySelector('.moon-icon');
      if (theme === 'light') {
        if (sunIcon) sunIcon.style.display = 'none';
        if (moonIcon) moonIcon.style.display = 'block';
      } else {
        if (sunIcon) sunIcon.style.display = 'block';
        if (moonIcon) moonIcon.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeToggleIcons();
    });
  </script>
</body>
</html>
